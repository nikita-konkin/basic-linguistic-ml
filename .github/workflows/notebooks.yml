name: Ноутбуки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      with_tensorflow:
        description: "Прогнать и работу № 4 (TensorFlow, долго)"
        type: boolean
        default: false

concurrency:
  group: notebooks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    name: Прогон лабораторных
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Версия, на которой комплект проверялся.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установить зависимости
        run: |
          pip install -r requirements-dev.txt
          # TensorFlow стоит в requirements.txt и тянет ~600 МБ; для работ 1-3
          # он не нужен, поэтому по умолчанию его не ставим.

      - name: Прогнать ноутбуки
        run: |
          if [ "${{ inputs.with_tensorflow }}" = "true" ]; then
            python scripts/run_notebooks.py --with-tensorflow
          else
            python scripts/run_notebooks.py
          fi
