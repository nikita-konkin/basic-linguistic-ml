    # Приём сданных работ курса МЛГ: страница сдачи на konkin-nikita.ru
    # шлёт сюда зашифрованные работы (контейнер mlg-submit, submit-server/).
    server {
        listen 443 ssl;
        ssl_certificate     /etc/letsencrypt/live/submit.konkin-nikita.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/submit.konkin-nikita.ru/privkey.pem;

        server_name submit.konkin-nikita.ru;

        # Работа до 10 МБ плюс конверт; точный предел проверяет сам сервис.
        client_max_body_size 12m;

        location / {
            set $mlgsubmit http://mlg-submit:8095;
            proxy_pass $mlgsubmit;
            proxy_http_version 1.1;

            # X-Real-IP задаёт nginx, клиент его не подделает: по нему
            # сервис ограничивает частоту отправок.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
        }
    }
