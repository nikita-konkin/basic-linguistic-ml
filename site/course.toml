about = """
Курс о том, как текст попадает в машинное обучение и что с ним там
происходит, — для тех, кто будет работать с переводом и локализацией.

Три лабораторные — «Классификация текстов», «Векторные представления и
память переводов», «Машинный перевод и оценка качества» — не отдельные
упражнения, а этапы одной задачи: конвейер локализации англо-русского
программного продукта. Сначала входящий материал разбирается по типу
контента, затем по памяти переводов ищутся похожие сегменты, наконец
принимается машинный перевод. Каждая работа берёт результат предыдущей и
добавляет к нему шаг.

Вводная работа «Классификация» знакомит со Scikit-Learn на классических
наборах данных (ирисы, пингвины). «Генерация текста» — демонстрация того,
как устроена языковая модель.

Работы конвейера используют один корпус — 160 сегментов локализации в четырёх
типах: интерфейс, документация, маркетинг, юридические тексты
(`loc_corpus.csv`). Числа на слайдах лекций посчитаны на нём же.
"""

